# /etc/nginx/sites-available/floodthai
# แทน flood.example.go.th และ path ให้ตรงเครื่องจริง แล้วออกใบรับรองด้วย: certbot --nginx -d flood.example.go.th

server {
    listen 80;
    server_name flood.example.go.th;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name flood.example.go.th;
    root /var/www/floodthai/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/flood.example.go.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flood.example.go.th/privkey.pem;

    charset utf-8;
    client_max_body_size 30m;           # รูปแนบ 3 รูป x 8MB + เผื่อ

    add_header X-Content-Type-Options nosniff always;

    # รูปผ่านแอปต้องถึง Laravel ไม่ถูกกฎ static ดักเป็น 404 เมื่อไม่มี symlink
    location ^~ /media/ {
        try_files $uri /index.php?$query_string;
    }

    # ไฟล์ static แคชนาน (ชื่อไฟล์มี ?v=เวลาแก้ไข อยู่แล้ว)
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # service worker ของแอปภาคสนาม ห้ามแคช
    location = /field-sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Laravel Reverb (realtime) ผ่าน 443 เดียวกัน
    location ~ ^/(app|apps)/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # อนุญาตเฉพาะจุดเข้าแอปและตัวติดตั้ง ไม่รัน PHP ในพื้นที่อัปโหลด
    location ~ ^/(index|install)\.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known) { deny all; }
}
