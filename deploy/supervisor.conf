; /etc/supervisor/conf.d/floodthai.conf
; sudo supervisorctl reread && sudo supervisorctl update

[program:floodthai-queue]
command=php /var/www/floodthai/artisan queue:work --sleep=2 --tries=3 --max-time=3600
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/floodthai/storage/logs/queue.log

[program:floodthai-reverb]
command=php /var/www/floodthai/artisan reverb:start --host=127.0.0.1 --port=8080
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/floodthai/storage/logs/reverb.log
; เปิดไฟล์ได้มากพอสำหรับการเชื่อมต่อพร้อมกันจำนวนมาก
minfds=10000
